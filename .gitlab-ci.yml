stages:
  - check
  - build

default:
  image: rust:latest

cache:
  key:
    files:
      - backend/Cargo.lock
    prefix: cargo-backend
  paths:
    - backend/target/

fmt:
  stage: check
  script:
    - rustup component add rustfmt
    - cargo fmt --check
    - working_directory: backend
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: true

test:
  stage: check
  script:
    - cargo test --locked
    - working_directory: backend
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:
  stage: build
  script:
    - cargo build --release --locked
    - working_directory: backend
  artifacts:
    name: "katproxy-linux-x86_64"
    paths:
      - backend/target/release/katproxy
    expire_in: 30 days
